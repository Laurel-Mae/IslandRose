<div class="product-card"><div class="product-image"><img src="{{ p['image'] }}" alt="{{ p['name'] }}"><span class="badge">{{ p['category'] }}</span></div><div class="product-info"><small>{{ p['category'] }}</small><h3>{{ p['name'] }}</h3><p>₱{{ '{:,.0f}'.format(p['price']) }}</p><div class="card-actions card-actions--order"><a class="btn btn-outline view-action" href="{{ url_for('product_detail', pid=p['id']) }}">View</a>{% if user and user['role']=='customer' %}{% if p['stock'] > 0 %}<form method="post" action="{{ url_for('add_to_cart', pid=p['id']) }}"><button class="btn btn-outline" type="submit">Add to Cart</button></form><form method="post" action="{{ url_for('order_now', pid=p['id']) }}"><button class="btn" type="submit">Order Now</button></form>{% else %}<span class="product-sold-out">Out of stock</span>{% endif %}{% elif not user %}<a class="btn btn-outline" href="{{ url_for('login') }}">Add to Cart</a><a class="btn" href="{{ url_for('login') }}">Order Now</a>{% endif %}</div></div></div>
